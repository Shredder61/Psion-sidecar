name: Software index updater tests

on:
  push:
    paths:
      - "update_software_indexes.py"
      - "tests/test_update_software_indexes.py"
      - ".github/workflows/software-index-tests.yml"
  pull_request:
    paths:
      - "update_software_indexes.py"
      - "tests/test_update_software_indexes.py"
      - ".github/workflows/software-index-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile updater
        run: python -m py_compile update_software_indexes.py
      - name: Run index generation regression tests
        run: python -m unittest discover -s tests -v
