name: Validate Sidecar updater

on:
  pull_request:
    paths:
      - "scripts/update-psion-sidecar"
      - "tests/test-update-psion-sidecar.sh"
      - "tests/test-crossword-rmr.py"
      - "sidecar_web.py"
      - ".github/workflows/validate-updater.yml"
  push:
    branches:
      - main
      - "fix/crossword-directory-permissions"
    paths:
      - "scripts/update-psion-sidecar"
      - "tests/test-update-psion-sidecar.sh"
      - "tests/test-crossword-rmr.py"
      - "sidecar_web.py"
      - ".github/workflows/validate-updater.yml"

permissions:
  contents: read

concurrency:
  group: updater-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shell-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check Bash syntax
        run: |
          bash -n scripts/update-psion-sidecar
          bash -n tests/test-update-psion-sidecar.sh

      - name: Run ShellCheck
        run: |
          shellcheck scripts/update-psion-sidecar tests/test-update-psion-sidecar.sh

      - name: Exercise updater success and rollback paths
        run: bash tests/test-update-psion-sidecar.sh

      - name: Test converted crossword links
        run: python3 -m unittest discover -s tests -p 'test-crossword-rmr.py'
